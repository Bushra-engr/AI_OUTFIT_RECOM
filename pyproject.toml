[project]
name = "outfit-ai-recomm"
version = "0.1.0"
description = "AURA - Smart Outfit Recommendation Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.12",
    "requests>=2.32.0",
    "supabase>=2.8.0",
    "groq>=0.11.0",
    "pillow>=10.4.0",
]

[tool.vercel]
entrypoint = "main:app"

